# /etc/nginx/sites-available/lotusludo
#
# Reverse proxy in front of the Node.js process. certbot appends the TLS
# block and the 80 -> 443 redirect when the certificate is issued
# (`certbot --nginx -d lotusplay.tech -d www.lotusplay.tech`), so only the
# HTTP server is defined here.
#
# The copy on the production server is authoritative; if the two differ,
# copy that one. This file is the starting point for a fresh host.

server {
    listen 80;
    listen [::]:80;
    server_name lotusplay.tech www.lotusplay.tech;

    # KYC documents and room images are uploaded through the app
    client_max_body_size 12M;

    # Voice signalling to the LiveKit container on the same host
    location /livekit/ {
        proxy_pass http://127.0.0.1:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else to the application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
